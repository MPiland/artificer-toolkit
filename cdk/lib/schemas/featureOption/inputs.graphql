input FeatureOptionInput {
  id: ID!
  label: String
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroupInput
  damage: DamageInput
  charges: ChargeInput
  range: RangeInput
  shape: ShapeInput
  targets: Int
  feats: [FeatureFeatInput!]
  modifiers: [FeatureModifierInput!]
  proficiencies: [FeatureProficiencyInput!]
  expertise: [FeatureExpertiseInput!]
  senses: [FeatureSenseInput!]
  spells: [FeatureSpellInput!]
  prerequisites: PrerequisiteInput
  saveAbility: SaveAbilityInput
  levelAvailable: String
  ownerId: ID!
  systemId: ID!
  masterId: String
}

input BatchFeatureOptionsInput {
  tableName: String!
  data: FeatureOptionInput!
}

