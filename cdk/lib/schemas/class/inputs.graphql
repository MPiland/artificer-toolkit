input HitpointInput {
  ability: ID!
  dieConfig: String
}

input StartingGoldInput {
  multiplier: Int!
  currency: ID!
  dieConfig: String
}

input PrepareLimitLevelInput {
  measurement: ID
  rounding: ID
}

input PrepareLimitInput {
  methods: [ID!]
  level: PrepareLimitLevelInput
}

input SpellcastingInput {
  magicName: String
  ability: ID
  maxSpellLevel: Int
  attributes: [ID!]
  charges: ChargeInput
  prepareLimit: PrepareLimitInput
}

input SpellSlotInput {
  slotCount: Int
}

input LevelAttributeInput {
  level: Int
  spellSlots: [SpellSlotInput!]
  resourcePoints: Int
  spellsKnownLimit: Int
  cantripsKnownLimit: Int
}

input ResourceInput {
  id: ID!
  label: String!
  levelAvailable: Int
  charges: ChargeInput
  method: ID
  desc: String
}

input MulticlassAbilityInput {
  id: ID
  minAmount: Int
}

input MulticlassInput {
  primaryAbility: MulticlassAbilityInput
  secondaryAbility: MulticlassAbilityInput
  optionalAbility: MulticlassAbilityInput
  proficiencies: [ClassProficiencyInput!]
}

input SubtypeInput {
  id: ID!
  label: String!
}

input ClassProficiencyInput {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID!
  level: ID!
  rounding: ID
  saveAbilities: [ID!]
  skills: [ID!]
  languages: [ID!]
  properties: ProficiencyPropertiesInput
  equipment: ProficiencyPropertiesInput
  prerequisites: PrerequisiteInput
}

input ClassInput {
  id: ID!
  label: String!
  desc: String
  category: ID!
  attributes: [ID!]
  details: [DetailInput!]
  hitpoint: HitpointInput
  startingGold: StartingGoldInput
  equipment: [[[EquipmentOptionItemInput!]!]!]
  proficiencies: [ClassProficiencyInput!]
  spellcasting: SpellcastingInput
  levelAttributes: [LevelAttributeInput!]
  resource: ResourceInput
  multiclass: MulticlassInput
  parentClass: ID
  subtypes: [SubtypeInput!]
  features: [FeatureInput!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

input BatchClassesInput {
  tableName: String!
  data: ClassInput!
}
