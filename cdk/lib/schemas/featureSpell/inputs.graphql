input SpellsByLevelInput {
  id: ID!
  ids: [ID!]
  level: Int
  spellLevel: Int
}

input FeatureSpellInput {
  id: ID!
  ids: [ID!]
  attributes: [ID!]
  selectionCount: Int
  classLimit: [ID!]
  levelLimit: [String!]
  attributeLimit: [ID!]
  ability: ID
  spellLevel: Int
  spellsByLevel: [SpellsByLevelInput!]
  subtype: ID
  prerequisites: PrerequisiteInput
  charges: ChargeInput
  ownerId: ID!
  systemId: ID!
  masterId: String
}

input BatchFeatureSpellsInput {
  tableName: String!
  data: FeatureSpellInput!
}
