# Live browser journeys on a GitHub runner against a throwaway stack: a self-hosted Convex container
# (the image live-backend.yml pins) plus the Session Worker under local `wrangler dev` and the web app,
# so a slice proves a browser journey without the gitignored local configuration. ADR 0035 forbids
# Convex Cloud, not this container; nothing here reaches Cloudflare or uses a repository secret. The
# container takes the local container and instance names, and scripts/throwawayConvexStack.mjs
# generates its env and the ignored local env files, so scripts/runLocalBrowserProof.mjs (Worker, web
# app, scripts/runLocalConvexProof.ps1) runs unchanged under pwsh on Linux. The container shares the
# runner's host network, so its Node actions reach the host Worker at host.docker.internal:8787.
# Every ci/** push runs the `select` job (scripts/affectedBrowserJourneys.mjs), which picks CI proofs
# (the *-browser proofs of scripts/runLocalConvexProof.ps1, the one proof list). A slice whose changes
# since the phase branch reach a journey through the Tests workflow's import graph runs the journeys its
# task's acceptance criteria name (the ledger's AC `journeys`); a stack change and a ci/merge-* batch run
# every CI proof; otherwise the run passes with no proof. A dispatch runs the named proofs (any
# runLocalConvexProof.ps1 proofs) or, unnamed, every CI proof; merge-slice dispatches it on each batch. The selected proofs run in shards, several per stack. A
# scripts/knownBugProofs.json proof runs in the non-gating shard until its fix task removes it. `reverse` runs each
# shard's proofs in reverse order, which proves they do not depend on each other. merge-slice requires
# every run on a tip green (docs/architecture/ci-validation.md#browser-journeys).
#   git push origin HEAD:ci/<slice>
#   gh workflow run browser-journeys.yml --ref ci/<slice> [-f proof="<name> ..."] [-f reverse=true]
name: Browser journeys

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      proof:
        description: Proofs from scripts/runLocalConvexProof.ps1, space-separated (empty runs every CI proof)
        default: ''
      reverse:
        description: Run each shard's proofs in reverse order
        type: boolean
        default: false

permissions:
  contents: read

# A named or reversed dispatch has its own group, so it never cancels the push run merge-slice reads.
concurrency:
  group: browser-journeys-${{ github.ref }}-${{ inputs.proof }}${{ inputs.reverse && '-reverse' || '' }}
  cancel-in-progress: true

env:
  # Slices branch from, and merge into, the phase branch; the selection diffs against it.
  PHASE_BRANCH: codex/phase-08-2-convex-cutover

jobs:
  select:
    name: Select browser journeys
    if: startsWith(github.ref, 'refs/heads/ci/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The selector diffs against the merge base with the phase branch; commits and trees only.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The selector imports only Node built-ins and repository scripts, so it needs no install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select the proofs this change reaches
        id: select
        env:
          PROOF: ${{ inputs.proof }}
          REVERSE: ${{ inputs.reverse && '--reverse' || '' }}
        run: node scripts/affectedBrowserJourneys.mjs --base "origin/$PHASE_BRANCH" --branch "$GITHUB_REF_NAME" --event "$GITHUB_EVENT_NAME" --proof "$PROOF" $REVERSE

  # Booting a stack takes longer than most proofs, so each shard boots one and runs its proofs on it in
  # turn; proofs make their own accounts and records, as they do on the long-lived local container. The
  # known-bug shard's failure leaves the run green.
  journey:
    name: ${{ matrix.name }} on a throwaway stack
    needs: select
    if: needs.select.outputs.shards != '[]'
    continue-on-error: ${{ matrix.knownBug }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # The local Worker's telemetry is the only Cloudflare endpoint wrangler dev would call.
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Install Chromium
        run: yarn workspace @artificer-toolkit/web exec playwright install --with-deps chromium
      - name: Start Convex backend
        run: |
          # Image digest: the single source is CONVEX_BACKEND_IMAGE in live-backend.yml.
          image=$(sed -nE 's/^  CONVEX_BACKEND_IMAGE: (.+)$/\1/p' .github/workflows/live-backend.yml)
          [ -n "$image" ] || { echo 'CONVEX_BACKEND_IMAGE not found in live-backend.yml.' >&2; exit 1; }
          docker run -d --name phase82-convex-local-linux --network host \
            --add-host host.docker.internal:127.0.0.1 \
            -e INSTANCE_NAME=phase82-local-linux \
            -e CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 -e CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            "$image"
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:3210/version && exit 0
            sleep 2
          done
          echo 'Convex backend did not become ready.' >&2
          exit 1
      - name: Provision the throwaway env
        run: node scripts/throwawayConvexStack.mjs --secrets-file="$RUNNER_TEMP/throwaway-secrets"
      # Function errors and console output are not in the container log, and the backend keeps only a
      # short history, so `convex logs` streams for the rest of the job.
      - name: Stream Convex function logs
        run: |
          key=$(docker exec phase82-convex-local-linux ./generate_admin_key.sh | tail -n 1)
          echo "::add-mask::$key"
          echo "::add-mask::${key##*|}"
          mkdir -p browser-journey-logs
          nohup yarn workspace @artificer-toolkit/apis exec convex logs \
            --url http://127.0.0.1:3210 --admin-key "$key" \
            > browser-journey-logs/convex-function.log 2>&1 &
      # Seeding builds Content snapshots into the R2 substitute; runLocalBrowserProof reuses it.
      - name: Start the local Convex fixtures
        run: pwsh -NoProfile -File scripts/localConvexFixtures.ps1 -Action start
      # Locally the native proofs run between the seed and the browser proofs, so the Content snapshot
      # builds are done; a fresh stack waits for them before the browser opens.
      - name: Deploy, seed and build Content snapshots
        run: node scripts/liveBackendValidation.mjs --steps=deploy,seed,snapshots --log-dir=browser-journey-logs/live-backend
      # Every proof runs even after one fails, and each reports its own result.
      - name: Run the shard's proofs
        env:
          PROOFS: ${{ toJSON(matrix.proofs) }}
        run: |
          failed=0
          while IFS=$'\t' read -r proof task; do
            label=${task:+ (KNOWN-BUG $task, not gating)}
            echo "::group::$proof"
            started=$SECONDS
            # account-deletion-browser requires its evidence name to start with the proof name.
            if node scripts/runLocalBrowserProof.mjs --name="$proof-ci" --proof="$proof"; then
              result=passed
            else
              result=FAILED
              failed=1
            fi
            echo '::endgroup::'
            # The seconds refresh scripts/browserJourneyDurations.json.
            echo "$proof $result in $((SECONDS - started)) s$label"
            echo "- $proof: $result in $((SECONDS - started)) s$label" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.proof, .knownBug] | @tsv' <<< "$PROOFS")
          exit "$failed"
      - name: Evidence holds no generated secret
        if: always()
        env:
          PROOFS: ${{ toJSON(matrix.proofs) }}
        run: |
          [ -f "$RUNNER_TEMP/throwaway-secrets" ] || exit 0
          mkdir -p browser-journey-logs
          docker logs phase82-convex-local-linux > browser-journey-logs/convex-backend.log 2>&1 || true
          # One folder per proof; the stack's logs stay at the top. A suite's Playwright log sits under
          # its fixed phase82- folder; the secret check cannot read the trace zips beside it.
          for proof in $(jq -r '.[].proof' <<< "$PROOFS"); do
            mkdir -p "browser-journey-logs/$proof"
            for path in "local-validation/browser-proof/$proof-ci" local-validation/local-convex-proofs/"$proof"-ci* local-validation/local-convex-proofs/phase82-"$proof"/playwright*.log; do
              [ -e "$path" ] && cp -R "$path" "browser-journey-logs/$proof/"
            done
          done
          if grep -rlFf "$RUNNER_TEMP/throwaway-secrets" browser-journey-logs; then
            echo 'A generated secret reached the evidence; it is not uploaded.' >&2
            rm -rf browser-journey-logs
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }} evidence
          path: browser-journey-logs/
          retention-days: 7
          if-no-files-found: ignore
