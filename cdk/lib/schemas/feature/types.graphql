type Feature {
  id: ID!
  label: String!
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroup
  damage: Damage
  charges: Charge
  optionsByLevel: [OptionsByLevel!]
  range: Range
  shape: Shape
  targets: Int
  feats: [FeatureFeat!]
  modifiers: [FeatureModifier!]
  proficiencies: [FeatureProficiency!]
  expertise: [FeatureExpertise!]
  senses: [FeatureSense!]
  spells: [FeatureSpell!]
  prerequisites: Prerequisite
  saveAbility: SaveAbility
  levelAvailable: String
  options: [FeatureOption!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type FeatureListItem {
  id: ID!
  label: String!
  desc: String
  detail: String
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type FeatureConnection {
  items: [FeatureListItem!]!
  nextToken: String
}
