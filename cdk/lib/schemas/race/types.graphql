type Ancestry {
  id: ID!
  label: String!
  desc: String
  options: [ID!]!
}

type RaceSpeed {
  walking: Int
  swimming: Int
  flying: Int
  climbing: Int
}

type Traits {
  details: [Detail!]
  size: ID
  speeds: RaceSpeed
}

type Race {
  id: ID!
  label: String!
  quote: String
  desc: String
  playable: String
  category: ID!
  lineages: [ID!]
  ancestry: Ancestry
  details: [Detail!]
  traits: Traits
  features: [ID!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type RaceMetaObject {
  raceIds: [ID!]!
  id: ID!
}

type RaceMeta {
  categories: [RaceMetaObject!]!
  playable: [RaceMetaObject!]!
  lineages: [RaceMetaObject!]!
  features: [RaceMetaObject!]!
}

type RaceListItem {
  id: ID!
  label: String!
  quote: String
  desc: String
  details: [Detail!]
  systemId: ID!
  masterId: String
}

type RaceConnection {
  items: [RaceListItem!]!
  metaData: RaceMeta!
  nextToken: String
}
