  saveAbilities: [ID!]
  skills: [ID!]
  languages: [ID!]
  properties: ProficiencyProperties
  equipment: ProficiencyProperties
  prerequisites: Prerequisite
}

type FeatureSense {
  id: ID!
  attributes: [ID!]
  selectionCount: Int
  subtype: ID
  ids: [ID!]
  prerequisites: Prerequisite
}

type SpellsByLevel {
  spells: [ID!]
