name: Set up the workspace
description: Node 24, the Yarn cache, an immutable install and the package dist output that tests and typechecks resolve, built here or downloaded from the build job.
inputs:
  build:
    description: Build the packages (the build job) instead of downloading the build job's dist artifact.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/cache@v4
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - name: Install
      shell: bash
      run: corepack enable && yarn install --immutable
    - name: Build packages
      if: inputs.build == 'true'
      shell: bash
      run: yarn turbo run build --filter=@artificer-toolkit/shared --filter=@artificer-toolkit/schema --filter=@artificer-toolkit/rules-runtime --filter=@artificer-toolkit/encounter-persistence --filter=@artificer-toolkit/source-data --filter=@artificer-toolkit/authoring --filter=@artificer-toolkit/emails --env-mode=loose
    - name: Download package dist
      if: inputs.build != 'true'
      uses: actions/download-artifact@v4
      with:
        name: package-dist
        path: packages
    # Not committed: the generator reads the built shared dist, so it runs after the build or download above.
    - name: Generate the SRD manifest
      shell: bash
      run: yarn workspace @artificer-toolkit/apis generate:srd:manifest
