input OptionsByLevelInput {
  level: Int
  count: Int
  replaceCount: Int
}

input FeatureInput {
  id: ID!
  label: String!
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroupInput
  damage: DamageInput
  charges: ChargeInput
  optionsByLevel: [OptionsByLevelInput!]
  range: RangeInput
  shape: ShapeInput
  targets: Int
  feats: [FeatureFeatInput!]
  modifiers: [FeatureModifierInput!]
  proficiencies: [FeatureProficiencyInput!]
  expertise: [FeatureExpertiseInput!]
  senses: [FeatureSenseInput!]
  spells: [FeatureSpellInput!]
  prerequisites: PrerequisiteInput
  saveAbility: SaveAbilityInput
  levelAvailable: String
  options: [FeatureOptionInput!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

input BatchFeaturesInput {
  tableName: String!
  data: FeatureInput!
}
