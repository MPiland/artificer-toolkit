type Hitpoint {
  ability: ID
  dieConfig: String
}

type StartingGold {
  multiplier: Int!
  currency: ID!
  dieConfig: String
}

type PrepareLimitLevel {
  measurement: ID
  rounding: ID
}

type PrepareLimit {
  methods: [ID!]
  level: PrepareLimitLevel
}

type Spellcasting {
  magicName: String
  ability: ID
  maxSpellLevel: Int
  attributes: [ID!]
  charges: Charge
  prepareLimit: PrepareLimit
}

type SpellSlot {
  slotCount: Int
}

type LevelAttribute {
  level: Int
  spellSlots: [SpellSlot!]
  resourcePoints: Int
  spellsKnownLimit: Int
  cantripsKnownLimit: Int
}

type Resource {
  label: String!
  id: ID!
  levelAvailable: Int
  charges: Charge
  method: ID
  desc: String
}

type MulticlassAbility {
  id: ID
  minAmount: Int
}

type Multiclass {
  primaryAbility: MulticlassAbility
  secondaryAbility: MulticlassAbility
  optionalAbility: MulticlassAbility
}

type Subtype {
  id: ID!
  label: String!
}

type ClassProficiency {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID!
  level: ID!
  rounding: ID
  saveAbilities: [ID!]
  skills: [ID!]
  languages: [ID!]
  properties: ProficiencyProperties
  equipment: ProficiencyProperties
  prerequisites: Prerequisite
}

type Class {
  id: ID!
  label: String!
  desc: String
  attributes: [ID!]
  category: ID!
  details: [Detail!]
  hitpoint: Hitpoint
  startingGold: StartingGold
  equipment: [[[EquipmentOptionItem!]!]!]
  proficiencies: [ClassProficiency!]
  spellcasting: Spellcasting
  levelAttributes: [LevelAttribute!]
  resource: Resource
  multiclass: Multiclass
  parentClass: ID
  subtypes: [Subtype!]
  features: [ID!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type ClassMetaObject {
  classIds: [ID!]!
  id: ID!
}

type ClassMultiClassMetaObject {
  classIds: [ID!]!
  id: ID!
  amount: Int
}

type ClassMeta {
  categories: [ClassMetaObject!]!
  parentClasses: [ClassMetaObject!]!
  primaryAbilities: [ClassMultiClassMetaObject!]!
  secondaryAbilities: [ClassMultiClassMetaObject!]!
  optionalAbilities: [ClassMultiClassMetaObject!]!
  features: [ClassMetaObject!]!
}

type ClassListItem {
  id: ID!
  label: String!
  desc: String
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type ClassConnection {
  items: [ClassListItem!]!
  metaData: ClassMeta!
  nextToken: String
}
