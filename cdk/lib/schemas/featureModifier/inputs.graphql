input ModifierDiePerLevelInput {
  level: Int!
  dieConfig: String!
}

input ModifierSetPerLevelInput {
  level: Int!
  setAmount: Int!
}

input FeatureModifierInput {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID
  type: ID
  method: ID
  methodAbility: ID
  methodSkill: ID
  multiplier: Int
  maxAmount: Int
  minAmount: Int
  setAmount: Int
  dieConfig: String
  feature: ID
  diePerLevel: [ModifierDiePerLevelInput!]
  setPerLevel: [ModifierSetPerLevelInput!]
  skills: [ID!]
  saveAbilities: [ID!]
  abilities: [ID!]
  speeds: [ID!]
  charges: ChargeInput
  range: ID
  minRange: Int
  maxRange: Int
  shape: ID
  size: Int
  duration: ID
  unit: ID
  conditions: [ID!]
  damageTypes: [ID!]
  damageType: ID
  spells: ID
  spellCategory: ID
  prerequisites: PrerequisiteInput
  ownerId: ID!
  systemId: ID!
  masterId: String
}

input BatchFeatureModifiersInput {
  tableName: String!
  data: FeatureModifierInput!
}
