type UpcastFields {
  id: ID
  size: Float
  unit: ID
  amount: Int
  minRange: Int
  maxRange: Int
  distance: Int
}

type UpcastLevel {
  level: Int
  damage: Damage
  duration: UpcastFields
  range: UpcastFields
  shape: UpcastFields
  targets: Int
}

type Upcast {
  attributes: [ID!]
  levels: [UpcastLevel]
}

type Shape {
  id: ID!
  size: Float
  unit: ID
}

type Duration {
  id: ID!
  amount: Int
}

type Range {
  id: ID!
  minRange: Int
  maxRange: Int
  distance: Int
  unit: ID
}

type Spell {
  id: ID!
  label: String!
  value: String!
  desc: String
  level: Int!
  school: ID!
  classes: [ID!]!
  attributes: [ID!]
  upcast: Upcast
  actions: ActionGroup
  targets: Int
  saveAbility: SaveAbility
  conditions: [ID!]
  requirements: [ID!]
  range: Range!
  shape: Shape
  duration: Duration!
  damage: Damage
  materialDesc: String
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type SpellMetaObject {
  spellIds: [ID!]
  id: ID!
}

type SpellActionMetaObject {
  spellIds: [ID!]
  id: ID!
  amount: Int
}

type SpellLevelObject {
  spellIds: [ID!]
  id: Int!
}

type SpellRangeMetaObject {
  id: ID!
  spellIds: [ID!]
  unit: ID
  minRange: Int
  maxRange: Int
  distance: Int
}

type SpellDurationMetaObject {
  id: ID!
  spellIds: [ID!]
  amount: Int
}

type SpellShapeMetaObject {
  id: ID!
  spellIds: [ID!]
  size: Float
  unit: ID
}

type SpellMeta {
  attributes: [SpellMetaObject!]!
  primaryDamages: [SpellMetaObject!]!
  secondaryDamages: [SpellMetaObject!]!
  primaryActions: [SpellActionMetaObject!]!
  secondaryActions: [SpellActionMetaObject!]!
  conditions: [SpellMetaObject!]!
  classes: [SpellMetaObject!]!
  durations: [SpellDurationMetaObject!]!
  ranges: [SpellRangeMetaObject!]!
  shapes: [SpellShapeMetaObject!]!
  schools: [SpellMetaObject!]!
  levels: [SpellLevelObject!]!
  saveAbilities: [SpellMetaObject!]!
  requirements: [SpellMetaObject!]!
}

type SpellListItem {
  id: ID!
  label: String!
  value: String!
  desc: String
  requirements: [ID!]
  materialDesc: String
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type ClassFilter {
  id: ID!
  count: Int!
}

type SpellConnection {
  items: [SpellListItem!]!
  metaData: SpellMeta!
  nextToken: String
}
