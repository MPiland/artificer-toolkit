input AncestryFeatureInput {
  id: ID!
  label: String
  value: String
  desc: String
  detail: String
  category: ID
  attributes: [ID]
  actions: ActionGroupInput
  damage: DamageInput
  charges: ChargeInput
  optionsByLevel: [OptionsByLevelInput!]
  range: RangeInput
  shape: ShapeInput
  targets: Int
  feats: [FeatureFeatInput!]
  modifiers: [FeatureModifierInput!]
  proficiencies: [FeatureProficiencyInput!]
  expertise: [FeatureExpertiseInput!]
  senses: [FeatureSenseInput!]
  spells: [FeatureSpellInput!]
  prerequisites: PrerequisiteInput
  saveAbility: SaveAbilityInput
  levelAvailable: String
  options: [FeatureOptionInput!]
}

input AncestryOptionInput {
  id: ID!
  value: String!
  label: String!
  desc: String
  features: [AncestryFeatureInput!]
}

input AncestryInput {
  id: ID!
  label: String!
  value: String!
  desc: String
  options: [AncestryOptionInput!]!
}

input RaceSpeedInput {
  walking: Int
  swimming: Int
  flying: Int
  climbing: Int
}

input TraitsInput {
  details: [DetailInput!]
  size: ID
  speeds: RaceSpeedInput
}

input RaceInput {
  id: ID!
  label: String!
  value: String!
  quote: String
  desc: String
  playable: String
  category: ID!
  lineages: [ID!]
  ancestry: AncestryInput
  details: [DetailInput!]
  traits: TraitsInput
  features: [FeatureInput!]
  ownerId: ID
  systemId: ID!
  masterId: String
}

input BatchRacesInput {
  tableName: String!
  data: RaceInput!
}
