input FeatureExpertiseInput {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID!
  saveAbilities: [ID!]
  skills: [ID!]
  languages: [ID!]
  properties: ProficiencyPropertiesInput
  equipment: ProficiencyPropertiesInput
  prerequisites: PrerequisiteInput
}

input BatchFeatureExpertisesInput {
  tableName: String!
  data: FeatureExpertiseInput!
}
