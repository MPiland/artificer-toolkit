## Basic Types

input DetailInput {
  label: String!
  value: String!
  desc: String
}

input SaveAbilityInput {
  id: ID!
  minAmount: Int
  attributes: [ID!]
  abilityModifier: ID
}

## Damage Related

input DamageFieldsInput {
  dieConfig: String
  attribute: ID
  id: ID
  ability: ID
  setAmount: Int
  multiplier: Int
  minAmount: Int
  maxAmount: Int
  pool: DamagePoolInput
}

input DamagePoolInput {
  attribute: ID
  setAmount: Int
  multiplier: Int
  minAmount: Int
  maxAmount: Int
  ability: ID
  option: ID
}

input SetPerLevelInput {
  level: String
  primary: Int
  secondary: Int
  bonus: Int
}

input DiePerLevelInput {
  level: String
  primary: DamageFieldsInput
  secondary: DamageFieldsInput
  bonus: DamageFieldsInput
}

input DamageInput {
  attributes: [ID!]
  damageSave: [ID!]
  setPerLevel: [SetPerLevelInput!]
  diePerLevel: [DiePerLevelInput!]
  primary: DamageFieldsInput
  secondary: DamageFieldsInput
  bonus: DamageFieldsInput
  versatile: DamageFieldsInput
}

## Charges

input UsesPerLevelInput {
  level: Int
  uses: Int
}

input ChargeInput {
  reset: ID
  limit: ID
  ability: ID
  skill: ID
  usesPerLevel: [UsesPerLevelInput]
  minAmount: Int
  addAmount: Int
  setAmount: Int
  multiplier: Int
  resourcePoints: Int
}

## Prerequisites

input EquipPrerequisiteInput {
  numberEquipped: Int
  category: ID
  equipment: [ID!]
  properties: [ID!]
}

input AbilityScoreInput {
  abilities: [ID!]
  score: Int
}

input PrerequisiteInput {
  options: [ID!]
  skillProficiencies: [ID!]
  equipmentProficiencies: [EquipPrerequisiteInput!]
  equipped: [EquipPrerequisiteInput!]
  notEquipped: [EquipPrerequisiteInput!]
  abilityScore: AbilityScoreInput
  spellsObtained: [ID!]
  featuresObtained: [ID!]
  optionsObtained: [ID!]
  size: [ID!]
}

## Feature Related

input FeatureFeatInput {
  id: ID!
  attributes: [ID!]
  feats: [ID!]
  selectionCount: Int
  subtype: ID
  prerequisites: PrerequisiteInput
}

input ModifierDiePerLevelInput {
  level: String
  dieConfig: String
}

input ModifierSetPerLevelInput {
  level: String
  setAmount: Int
}

input FeatureModifierInput {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID
  type: ID
  method: ID
  methodAbility: ID
  methodSkill: ID
  multiplier: Int
  maxAmount: Int
  minAmount: Int
  setAmount: Int
  dieConfig: String
  feature: ID
  diePerLevel: [ModifierDiePerLevelInput!]
  setPerLevel: [ModifierSetPerLevelInput!]
  skills: [ID!]
  saveAbilities: [ID!]
  abilities: [ID!]
  speeds: [ID!]
  charge: ChargeInput
  range: ID
  minRange: Int
  maxRange: Int
  shape: ID
  size: Int
  duration: ID
  unit: ID
  conditions: [ID!]
  damageTypes: [ID!]
  damageType: ID
  spells: ID
  spellCategory: ID
  prerequisites: PrerequisiteInput
}

input ProficiencyPropertiesInput {
  ids: [ID!]
  category: ID
  properties: [ID!]
}

input FeatureProficiencyInput {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID!
  level: ID
  rounding: ID
  saveAbilities: [ID!]
  skills: [ID!]
  languages: [ID!]
  properties: ProficiencyPropertiesInput
  equipment: ProficiencyPropertiesInput
  prerequisites: PrerequisiteInput
}

input FeatureExpertiseInput {
  id: ID!
  subtype: ID
  attributes: [ID!]
  selectionCount: Int
  category: ID!
  saveAbilities: [ID!]
  skills: [ID!]
  languages: [ID!]
  properties: ProficiencyPropertiesInput
  equipment: ProficiencyPropertiesInput
  prerequisites: PrerequisiteInput
}

input FeatureSenseInput {
  id: ID!
  attributes: [ID!]
  selectionCount: Int
  subtype: ID
  ids: [ID!]
  prerequisites: PrerequisiteInput
  charges: ChargeInput
}

input SpellsByLevelInput {
  id: ID!
  spells: [ID!]
  level: Int
  spellLevel: Int
}

input FeatureSpellInput {
  ids: [ID!]
  attributes: [ID!]
  selectionCount: Int
  classLimit: [ID!]
  levelLimit: [String!]
  attributeLimit: [ID!]
  ability: ID
  spellLevel: Int
  spellsByLevel: [SpellsByLevelInput!]
  subtype: ID
  prerequisites: PrerequisiteInput
  charges: ChargeInput
}

input ActionPropertyInput {
  id: ID
  amount: Int
}

input ActionGroupInput {
  primary: ActionPropertyInput
  secondary: ActionPropertyInput
}

input OptionsByLevelInput {
  level: Int
  count: Int
  replaceCount: Int
}

input FeatureOptionInput {
  id: ID!
  label: String
  value: String
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroupInput
  damage: DamageInput
  charges: ChargeInput
  range: RangeInput
  shape: ShapeInput
  targets: Int
  feats: [FeatureFeatInput!]
  modifiers: [FeatureModifierInput!]
  proficiencies: [FeatureProficiencyInput!]
  expertise: [FeatureExpertiseInput!]
  senses: [FeatureSenseInput!]
  spells: [FeatureSpellInput!]
  prerequisites: PrerequisiteInput
  saveAbility: SaveAbilityInput
  levelAvailable: String
}

input FeatureInput {
  id: ID!
  label: String
  value: String
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroupInput
  damage: DamageInput
  charges: ChargeInput
  optionsByLevel: [OptionsByLevelInput!]
  range: RangeInput
  shape: ShapeInput
  targets: Int
  feats: [FeatureFeatInput!]
  modifiers: [FeatureModifierInput!]
  proficiencies: [FeatureProficiencyInput!]
  expertise: [FeatureExpertiseInput!]
  senses: [FeatureSenseInput!]
  spells: [FeatureSpellInput!]
  prerequisites: PrerequisiteInput
  saveAbility: SaveAbilityInput
  levelAvailable: String
  options: [FeatureOptionInput!]
}
