input AncestryInput {
  id: ID!
  label: String!
  desc: String
  options: [ID!]!
}

input RaceSpeedInput {
  walking: Int
  swimming: Int
  flying: Int
  climbing: Int
}

input TraitsInput {
  details: [DetailInput!]
  size: ID
  speeds: RaceSpeedInput
}

input RaceInput {
  id: ID!
  label: String!
  quote: String
  desc: String
  playable: String
  category: ID!
  lineages: [ID!]
  ancestry: AncestryInput
  details: [DetailInput!]
  traits: TraitsInput
  features: [ID!]
  ownerId: ID
  systemId: ID!
  masterId: String
}

input BatchRacesInput {
  tableName: String!
  data: RaceInput!
}
