# Slice validation on GitHub runners. It never runs on ordinary pushes, pull requests or a schedule.
# A slice session pushes its branch to its own `ci/<slice>` branch (fast-forward only, never main):
#   git push origin HEAD:ci/<slice>
# and reads the result with `gh run list --branch ci/<slice>` / `gh run watch`. Each `ci/*` branch runs
# on its own, so slices validate in parallel; a newer push to the same branch cancels the older run.
# Convex tests run in-process with convex-test, so no Convex deployment is touched (ADR 0035). Live
# backend work (codegen push, reset, seed, audit, live proofs, Playwright) stays local.
name: Tests

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex:
    name: Convex suite ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn workspace @artificer-toolkit/apis test:convex --shard=${{ matrix.shard }}/4

  packages-worker:
    name: Packages and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Package tests
        run: |
          yarn workspace @artificer-toolkit/schema test
          yarn workspace @artificer-toolkit/shared test
          yarn workspace @artificer-toolkit/source-data test
          yarn workspace @artificer-toolkit/rules-runtime test
          yarn workspace @artificer-toolkit/encounter-persistence test
      - name: Worker tests
        run: |
          yarn workspace @artificer-toolkit/session-worker types
          yarn workspace @artificer-toolkit/session-worker test
          yarn workspace @artificer-toolkit/session-worker test:unit

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn workspace @artificer-toolkit/web test

  # The account runs at most 20 jobs at once, so typechecks share two sequential jobs instead of one job
  # each; both finish inside the Convex and web test critical path. Every step runs even after a failure,
  # so one run reports all typecheck errors. One tsc at a time: parallel tsc processes exhaust a runner.
  typecheck-packages:
    name: Typecheck Convex, Worker and packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Convex typecheck loads ~2.9 MB of generated API types; give tsc room.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Convex
        run: yarn turbo run typecheck:convex --filter=@artificer-toolkit/apis --env-mode=loose
      - name: Worker and apis
        if: success() || failure()
        run: yarn turbo run typecheck --filter=@artificer-toolkit/session-worker --filter=@artificer-toolkit/apis --concurrency=1 --env-mode=loose --continue
      - name: Packages
        if: success() || failure()
        run: yarn turbo run typecheck --filter=@artificer-toolkit/rules-runtime --filter=@artificer-toolkit/encounter-persistence --filter=@artificer-toolkit/schema --filter=@artificer-toolkit/shared --filter=@artificer-toolkit/source-data --filter=@artificer-toolkit/authoring --concurrency=1 --env-mode=loose --continue

  typecheck-web:
    name: Typecheck web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: App
        run: yarn turbo run typecheck:app --filter=@artificer-toolkit/web --env-mode=loose
      - name: Tests
        if: success() || failure()
        run: yarn turbo run typecheck:tests --filter=@artificer-toolkit/web --env-mode=loose
      - name: Stories
        if: success() || failure()
        run: yarn turbo run typecheck:stories --filter=@artificer-toolkit/web --env-mode=loose
