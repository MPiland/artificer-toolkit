type Background {
  id: ID!
  label: String!
  desc: String
  details: [Detail!]
  equipment: [[[EquipmentOptionItem!]!]!]
  proficiencies: [FeatureProficiency!]
  features: [ID!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type BackgroundMetaObject {
  id: ID!
  backgroundIds: [ID!]!
}

type BackgroundMeta {
  features: [BackgroundMetaObject!]!
}

type BackgroundListItem {
  id: ID!
  label: String!
  desc: String
  details: [Detail!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type BackgroundConnection {
  items: [BackgroundListItem!]!
  metaData: BackgroundMeta!
  nextToken: String
}
