input BackgroundInput {
  id: ID!
  label: String!
  desc: String
  details: [DetailInput!]
  equipment: [[[EquipmentOptionItemInput!]!]!]
  proficiencies: [FeatureProficiencyInput!]
  features: [FeatureInput!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

input BatchBackgroundsInput {
  tableName: String!
  data: BackgroundInput!
}
