input FeatureOptionInput {
  id: ID!
  label: String
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroupInput
  damage: DamageInput
  charges: ChargeInput
  range: RangeInput
  shape: ShapeInput
  targets: Int
  feats: [ID!]
  modifiers: [ID!]
  proficiencies: [ID!]
  expertise: [ID!]
  senses: [ID!]
  spells: [ID!]
  prerequisites: PrerequisiteInput
  saveAbility: SaveAbilityInput
  levelAvailable: String
}

input BatchFeatureOptionsInput {
  tableName: String!
  data: FeatureOptionInput!
}

