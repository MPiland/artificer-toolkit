type AncestryFeature {
  id: ID!
  label: String
  value: String
  desc: String
  detail: String
  category: ID
  attributes: [ID!]
  actions: ActionGroup
  damage: Damage
  charges: Charge
  optionsByLevel: [OptionsByLevel!]
  range: Range
  shape: Shape
  targets: Int
  feats: [FeatureFeat!]
  modifiers: [FeatureModifier!]
  proficiencies: [FeatureProficiency!]
  expertise: [FeatureExpertise!]
  senses: [FeatureSense!]
  spells: [FeatureSpell!]
  prerequisites: Prerequisite
  saveAbility: SaveAbility
  levelAvailable: String
  options: [FeatureOption!]
}

type AncestryOption {
  id: ID!
  value: String!
  label: String!
  desc: String
  features: [AncestryFeature!]
}

type Ancestry {
  id: ID!
  label: String!
  value: String!
  desc: String
  options: [AncestryOption!]!
}

type RaceSpeed {
  walking: Int
  swimming: Int
  flying: Int
  climbing: Int
}

type Traits {
  details: [Detail!]
  size: ID
  speeds: RaceSpeed
}

type Race {
  id: ID!
  label: String!
  value: String!
  quote: String
  desc: String
  playable: String
  category: ID!
  lineages: [ID!]
  ancestry: Ancestry
  details: [Detail!]
  traits: Traits
  features: [Feature!]
  ownerId: ID!
  systemId: ID!
  masterId: String
}

type RaceMetaObject {
  raceIds: [ID!]
  id: ID!
}

type RaceFeatureMetaObject {
  id: ID!
  label: String!
  raceIds: [ID!]
}

type RaceMeta {
  categories: [RaceMetaObject!]!
  playable: [RaceMetaObject!]!
  lineages: [RaceMetaObject!]!
  features: [RaceFeatureMetaObject!]!
}

type RaceListItem {
  id: ID!
  label: String!
  value: String!
  quote: String
  desc: String
  details: [Detail!]
  systemId: ID!
  masterId: String
}

type RaceConnection {
  items: [RaceListItem!]!
  metaData: RaceMeta!
  nextToken: String
}
