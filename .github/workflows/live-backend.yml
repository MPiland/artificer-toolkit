# Live-backend validation on a GitHub runner: manifest, codegen push, deploy, seed and SRD audit against
# an ephemeral self-hosted Convex backend container (the open-source image the local Docker backend
# runs). It is a sibling of tests.yml because it needs a container, and runs beside it on every `ci/**`
# push that changes the backend's inputs, so a slice finds its own generated-file drift before merge. ADR 0035 forbids Convex Cloud,
# not this container, which is discarded with the runner. No pull_request trigger (so never for forks),
# no repository secrets: the admin key is generated inside the container and only masked in memory.
#   git push origin HEAD:ci/<slice>
#   gh workflow run live-backend.yml --ref ci/<slice> [-f steps=manifest,codegen,deploy,seed,replace,reseed,audit]
# The SRD manifest is not committed: the setup action generates it. The run fails if the regenerated Convex
# `_generated` files differ from the commit. When that drift is the only failure, the `auto-fix` job commits
# the regenerated files back to the same
# ci/** branch and dispatches Tests and Live on the new commit (see the job for its guards).
name: Live backend

on:
  push:
    branches: ['ci/**']
    # Only what the deployed functions, generated files or seeded corpus are built from.
    paths:
      - 'apps/apis/**'
      - 'packages/**'
      - '!packages/design-system/**'
      - 'scripts/liveBackendValidation.mjs'
      - 'scripts/generatedDrift.mjs'
      - '.github/workflows/live-backend.yml'
      - '.github/actions/setup/**'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:
    inputs:
      steps:
        description: Comma-separated scripts/liveBackendValidation.mjs steps to run (empty runs all)
        required: false

permissions:
  contents: read

concurrency:
  group: live-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one machine-readable source of the image digest: the digest the local phase82-convex-local-linux
  # container runs (apps/apis/README.md points here).
  CONVEX_BACKEND_IMAGE: ghcr.io/convex/convex-backend@sha256:69885bae73766f625404a5425b22702341e89b43002f1d700864f8364be0d1f8

jobs:
  live-backend:
    name: Deploy, seed and audit on an ephemeral backend
    if: startsWith(github.ref, 'refs/heads/ci/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # 'failure' only when every earlier step passed (later steps are skipped after a failure), so it means
      # generated-file drift was the one failure.
      drift: ${{ steps.drift.outcome }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Start Convex backend
        run: |
          # The origins become the deployment's built-in CONVEX_URL and CONVEX_SITE_URL (the auth config's
          # domain). The instance name matches the local container, so one /instance_name check serves both.
          docker run -d --name convex-live -p 127.0.0.1:3210:3210 -p 127.0.0.1:3211:3211 \
            -e INSTANCE_NAME=phase82-local-linux \
            -e CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 -e CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            "$CONVEX_BACKEND_IMAGE"
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:3210/version && exit 0
            sleep 2
          done
          echo 'Convex backend did not become ready.' >&2
          exit 1
      - name: Deploy, seed and audit
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          # --steps only when the dispatch input is set; the script owns the default step list.
          args=(--container=convex-live --fresh --log-dir=live-backend-logs)
          if [ -n "$STEPS" ]; then args+=(--steps="$STEPS"); fi
          node scripts/liveBackendValidation.mjs "${args[@]}"
      - name: Generated files match the commit
        id: drift
        run: node scripts/generatedDrift.mjs apps/apis/convex/_generated apps/apis/convex/betterAuth/_generated
      # The regenerated files, kept for the `auto-fix` job below.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.drift.outcome == 'failure'
        with:
          name: generated-files
          path: |
            apps/apis/convex/_generated/
            apps/apis/convex/betterAuth/_generated/
          retention-days: 7
      - name: Step durations
        if: always()
        run: |
          [ -f live-backend-logs/summary.json ] || exit 0
          {
            echo '| Step | Exit | Seconds |'
            echo '| --- | --- | --- |'
            node -e "for (const s of JSON.parse(require('fs').readFileSync('live-backend-logs/summary.json','utf8'))) console.log('| ' + s.step + ' | ' + s.status + ' | ' + s.seconds + ' |')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-backend-logs
          path: live-backend-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Backend log tail
        if: failure()
        run: docker logs --tail 100 convex-live

  # Commits the regenerated files back to the ci/** branch when generated-file drift was the only failure.
  # Guards: ci/** ref only (never the phase branch or main); full runs only; HEAD is not already an
  # auto-fix commit (no loop); the push is a plain fast-forward, so a branch that moved meanwhile is
  # rejected and the run fails as before. GITHUB_TOKEN pushes trigger no workflows, so Tests and Live are
  # dispatched explicitly. Write permissions exist only on this job.
  auto-fix:
    name: Commit regenerated files to the ci branch
    needs: live-backend
    if: >-
      always() && needs.live-backend.outputs.drift == 'failure'
      && startsWith(github.ref, 'refs/heads/ci/') && inputs.steps == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Skip when HEAD is already an auto-fix commit
        id: guard
        run: |
          if git log -1 --format=%B | grep -qx 'Generated-By: live-backend auto-fix'; then
            echo 'HEAD is an auto-fix commit and drift remains; not committing again.' >&2
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          name: generated-files
          path: generated-files
      - name: Commit, push and dispatch
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Replace the generated paths wholesale so files codegen removed are removed too.
          rm -rf apps/apis/convex/_generated apps/apis/convex/betterAuth/_generated
          cp -R generated-files/. apps/apis/convex/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- apps/apis/convex/_generated apps/apis/convex/betterAuth/_generated
          git commit -m 'Regenerate generated files (live-backend auto-fix)' -m 'Generated-By: live-backend auto-fix'
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run tests.yml --ref "$BRANCH"
          gh workflow run live-backend.yml --ref "$BRANCH"
          echo "Auto-fix commit $(git rev-parse HEAD) pushed to $BRANCH; Tests and Live dispatched." >> "$GITHUB_STEP_SUMMARY"
