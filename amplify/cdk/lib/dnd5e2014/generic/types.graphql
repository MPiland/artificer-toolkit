  minAmount: Int
  setAmount: Int
  dieConfig: String
  feature: ID
  diePerLevel: [ModifierDiePerLevel!]
  setPerLevel: [ModifierSetPerLevel!]
  skills: [ID!]
  saveAbilities: [ID!]
  abilities: [ID!]
  speeds: [ID!]
  charge: Charge
  range: ID
  minRange: Int
  maxRange: Int
  shape: ID
  size: Int
  duration: ID
  unit: ID
  conditions: [ID!]
  damageTypes: [ID!]
  damageType: ID
  spell: ID
  spellCategory: ID
  prerequisites: Prerequisite
