## Enums

enum FeatureEnumInput {
  ALL
  SAVE_ABILITY
  OPTION
  EQUIPMENT
  FEATURE
}

enum DamageEnumInput {
  ALL
  EQUIPMENT
  MAIN
  POOL
  BONUS
}

enum SpellEnumInput {
  ALL
  UPCAST
  DAMAGE
}

enum FeatEnumInput {
  ALL
}

enum SectionEnumInput {
  ALL
  SPELL
  SUBCLASS
}

enum EquipmentEnumInput {
  ALL
  CLASS
  SHIELD
  ADVENTURING_GEAR
  WEAPON
  ARMOR
  TOOL
  BACKGROUND
}

enum ClassesEnumInput {
  ALL
  SPELLCASTER
  BASE
  SUBCLASS
  RESOURCE
  PREPARE_LIMIT
}

input GenericTypeInput {
  id: ID!
  label: String!
  desc: String
  tooltip: String
  short: String
}

## Currency

input CurrencyConversionInput {
  copper: Float! = 0
  silver: Float! = 0
  gold: Float! = 0
  electrum: Float! = 0
  platinum: Float! = 0
}

input CurrencyInput {
  id: ID!
  label: String!
  desc: String
  abbreviation: String!
  conversions: CurrencyConversionInput!
}

## Equipment

input EquipmentCategoryPropertyInput {
  id: ID!
  propertyId: ID!
  categoryId: ID!
}

input SystemEquipmentInput {
  categories: [GenericTypeInput!]!
  properties: [GenericTypeInput!]!
  categoryProperties: [EquipmentCategoryPropertyInput!]!
  rarities: [GenericTypeInput!]!
}

## Modifiers

input ModifierCategoryTypeInput {
  id: ID!
  typeId: String!
  categoryId: String!
}

input ModifierTypeMethodInput {
  id: ID!
  typeId: String!
  methodId: String!
}

input ModifierCategoryTypeMethodInput {
  id: ID!
  methodId: String!
  typeId: String!
  categoryId: String!
}

input SystemModifiersInput {
  categories: [GenericTypeInput!]!
  types: [GenericTypeInput!]!
  methods: [GenericTypeInput!]!
  spellCategories: [GenericTypeInput!]!
  categoryTypes: [ModifierCategoryTypeInput!]!
  typeMethods: [ModifierTypeMethodInput!]!
  categoryMethods: [ModifierCategoryTypeMethodInput!]!
}

## Proficiency

input ProficiencyLevelInput {
  id: ID!
  label: String!
  multiplier: Float
}

input SystemProficiencyInput {
  levels: [ProficiencyLevelInput!]!
  categories: [GenericTypeInput!]!
}

## Spell

input SystemSpellInput {
  categories: [GenericTypeInput!]!
  durations: [GenericTypeInput!]!
  ranges: [GenericTypeInput!]!
  schools: [GenericTypeInput!]!
  shapes: [GenericTypeInput!]!
  requirements: [GenericTypeInput!]!
}

## Rules

input GenerateOptionInput {
  id: ID!
  label: String!
  reduce: Int
}

input ImperialInput {
  weight: [GenericTypeInput!]!
  volume: [GenericTypeInput!]!
  length: [GenericTypeInput!]!
}

input SystemMeasurementInput {
  amount: [GenericTypeInput!]!
  rounding: [GenericTypeInput!]!
  imperial: ImperialInput!
}

input AbilityGenerateMethodInput {
  id: ID!
  label: String!
  total: Int
  options: [GenerateOptionInput!]
}

input SystemRulesInput {
  measurements: SystemMeasurementInput!
  abilityGenerateMethod: [AbilityGenerateMethodInput!]!
}

## Charges

input ChargeOptionInput {
  id: ID!
  label: String!
  features: [FeatureEnumInput!]
  damage: [DamageEnumInput!]
  feats: [FeatEnumInput!]
  sections: [SectionEnumInput!]
  spells: [SpellEnumInput!]
  equipment: [EquipmentEnumInput!]
  classes: [ClassesEnumInput!]
}

input SystemChargesInput {
  resets: [ChargeOptionInput!]!
  limits: [ChargeOptionInput!]!
}

## Character

input CharacterSettingInput {
  hitpointCalcMethods: [GenericTypeInput!]!
  advancementMethods: [GenericTypeInput!]!
  spellPointCalcMethods: [GenericTypeInput!]!
  startingEquipmentOptions: [GenericTypeInput!]!
}

## System Builder

input SystemActionInput {
  id: ID!
  label: String!
  features: Boolean! = false
  damage: Boolean! = false
  feats: Boolean! = false
  sections: Boolean! = false
  spells: Boolean! = false
  equipment: Boolean! = false
  classes: Boolean! = false
}

input SystemAttributeInput {
  id: ID!
  label: String!
  features: [FeatureEnumInput!]
  damage: [DamageEnumInput!]
  feats: [FeatEnumInput!]
  sections: [SectionEnumInput!]
  spells: [SpellEnumInput!]
  equipment: [EquipmentEnumInput!]
  classes: [ClassesEnumInput!]
}

input SystemCategoryInput {
  id: ID!
  label: String!
  features: Boolean! = false
  classes: Boolean! = false
  races: Boolean! = false
}

input SystemSenseInput {
  id: ID!
  label: String!
  creatureDesc: String
  monsterDesc: String
  type: [String]
}

input SystemSkillInput {
  id: ID!
  label: String!
  desc: String
  abilityId: ID!
}

input SystemPrerequisiteInput {
  id: ID!
  label: String!
  features: [FeatureEnumInput!]
  damage: [DamageEnumInput!]
  feats: [FeatEnumInput!]
  sections: [SectionEnumInput!]
  spells: [SpellEnumInput!]
  equipment: [EquipmentEnumInput!]
  classes: [ClassesEnumInput!]
}

input SystemInput {
  id: ID!
  label: String!
  desc: String
  abilities: [GenericTypeInput!]!
  actions: [SystemActionInput!]!
  alignments: [GenericTypeInput!]!
  attributes: [SystemAttributeInput!]!
  categories: [SystemCategoryInput!]!
  characters: CharacterSettingInput!
  charges: SystemChargesInput!
  conditions: [GenericTypeInput!]!
  currencies: [CurrencyInput!]!
  damageTypes: [GenericTypeInput!]!
  equipment: SystemEquipmentInput!
  languages: [GenericTypeInput!]!
  modifiers: SystemModifiersInput!
  passives: [GenericTypeInput!]!
  prerequisites: [SystemPrerequisiteInput!]!
  proficiencies: SystemProficiencyInput!
  rules: SystemRulesInput!
  senses: [SystemSenseInput!]!
  sizes: [GenericTypeInput!]!
  skills: [SystemSkillInput!]!
  speeds: [GenericTypeInput!]!
  spells: SystemSpellInput!
  terrains: [GenericTypeInput!]!
  ownerId: String!
  masterId: String
}

input BatchSystemsInput {
  tableName: String!
  data: SystemInput!
}
