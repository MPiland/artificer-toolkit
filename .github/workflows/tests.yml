# Manual-only test run. It never runs on ordinary pushes, pull requests or a schedule.
# Start it from GitHub (Actions → Tests → Run workflow, once this file is on the default branch)
# or by deliberately pushing a commit to the dedicated `ci/run` branch:
#   git push --force origin HEAD:ci/run
name: Tests

on:
  push:
    branches: ['ci/run']
  workflow_dispatch:
    inputs:
      convex_shards:
        description: Number of parallel runners for the Convex suite
        type: choice
        options: ['4', '6']
        default: '4'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex-shards:
    name: Convex suite ${{ matrix.shard }}/${{ inputs.convex_shards || '4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The matrix lists the maximum; jobs above the chosen shard count exit immediately.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Skip shard outside the chosen count
        id: gate
        run: echo "run=$([ ${{ matrix.shard }} -le ${{ inputs.convex_shards || '4' }} ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: corepack enable && yarn install --immutable
      - name: Build packages
        if: steps.gate.outputs.run == 'true'
        run: yarn turbo run build --filter=@artificer-toolkit/shared --filter=@artificer-toolkit/schema --filter=@artificer-toolkit/rules-runtime --filter=@artificer-toolkit/encounter-persistence --filter=@artificer-toolkit/source-data --filter=@artificer-toolkit/authoring --filter=@artificer-toolkit/emails --env-mode=loose
      - name: Convex tests (shard ${{ matrix.shard }})
        if: steps.gate.outputs.run == 'true'
        run: yarn workspace @artificer-toolkit/apis test:convex --shard=${{ matrix.shard }}/${{ inputs.convex_shards || '4' }}

  packages-worker-web:
    name: Packages, Worker and web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: corepack enable && yarn install --immutable
      - name: Build packages
        run: yarn turbo run build --filter=@artificer-toolkit/shared --filter=@artificer-toolkit/schema --filter=@artificer-toolkit/rules-runtime --filter=@artificer-toolkit/encounter-persistence --filter=@artificer-toolkit/source-data --filter=@artificer-toolkit/authoring --filter=@artificer-toolkit/emails --env-mode=loose
      - name: Package tests
        run: |
          yarn workspace @artificer-toolkit/schema test
          yarn workspace @artificer-toolkit/shared test
          yarn workspace @artificer-toolkit/source-data test
          yarn workspace @artificer-toolkit/rules-runtime test
          yarn workspace @artificer-toolkit/encounter-persistence test
      - name: Worker tests
        run: |
          yarn workspace @artificer-toolkit/session-worker types
          yarn workspace @artificer-toolkit/session-worker test
          yarn workspace @artificer-toolkit/session-worker test:unit
      - name: Web tests
        run: yarn workspace @artificer-toolkit/web test

  typechecks:
    name: Typechecks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The Convex typecheck loads ~2.9 MB of generated API types; run typechecks one at a time with room for tsc.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: corepack enable && yarn install --immutable
      - name: Worker types
        run: yarn workspace @artificer-toolkit/session-worker types
      - name: Backend typechecks
        run: yarn turbo run typecheck typecheck:convex --filter=@artificer-toolkit/apis --filter=@artificer-toolkit/session-worker --filter=@artificer-toolkit/rules-runtime --filter=@artificer-toolkit/encounter-persistence --filter=@artificer-toolkit/schema --filter=@artificer-toolkit/shared --filter=@artificer-toolkit/source-data --concurrency=1 --env-mode=loose --continue
      - name: Web typechecks
        run: yarn turbo run typecheck:app typecheck:stories typecheck:tests --filter=@artificer-toolkit/web --concurrency=1 --env-mode=loose --continue
